services:
  - type: web
    name: two-panel-chat-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/conversations
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: AI_PROVIDER
        value: groq
      - key: AI_MAX_TOKENS
        value: 1024
      - key: AI_TIMEOUT_MS
        value: 60000
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
