<div
  class="inline-flex rounded-lg bg-slate-100 p-0.5 ring-1 ring-slate-200"
  role="group"
  aria-label="Answerer composition mode"
>
  @for (option of options; track option.value) {
    <button
      type="button"
      class="flex items-center gap-1.5 rounded-md px-3 py-1 text-xs font-semibold transition-colors disabled:cursor-not-allowed disabled:opacity-50"
      [class]="
        mode() === option.value
          ? 'bg-white text-emerald-700 shadow-sm'
          : 'text-slate-500 hover:text-slate-700'
      "
      [attr.aria-pressed]="mode() === option.value"
      [attr.title]="disabled() ? disabledHint() : null"
      [disabled]="disabled()"
      (click)="modeChange.emit(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
