<div class="flex items-center justify-between gap-2 px-3 py-2.5">
  <h2 class="text-xs font-semibold tracking-wide text-slate-500 uppercase">Chats</h2>
  @if (refreshing()) {
    <span
      class="h-3 w-3 animate-spin rounded-full border-2 border-slate-300 border-t-slate-500"
      role="status"
      aria-label="Refreshing chats"
    ></span>
  }
</div>

<button
  type="button"
  (click)="create.emit()"
  class="mx-3 mb-2 flex shrink-0 items-center justify-center gap-1.5 rounded-xl bg-slate-800 px-3 py-2 text-xs font-semibold text-white shadow-sm transition-colors hover:bg-slate-700"
>
  <svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
    <path
      d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z"
    />
  </svg>
  New chat
</button>

<div class="min-h-0 flex-1 overflow-y-auto px-2 pb-2">
  @if (showSkeleton()) {
    <ul class="flex flex-col gap-0.5" aria-hidden="true">
      @for (row of skeletonRows; track row) {
        <li class="flex flex-col gap-1.5 rounded-xl px-2.5 py-2.5">
          <span class="h-2.5 w-2/3 animate-pulse rounded bg-slate-300/70"></span>
          <span class="h-2 w-full animate-pulse rounded bg-slate-200/80"></span>
        </li>
      }
    </ul>
    <p class="sr-only" role="status">Loading chats…</p>
  } @else if (summaries().length === 0) {
    <p class="px-2 py-6 text-center text-xs text-slate-400">
      Chats you start in this browser show up here.
    </p>
  } @else {
    <ul class="flex flex-col gap-0.5">
      @for (summary of summaries(); track summary.id) {
        <li>
          <div
            class="group flex w-full items-start gap-2 rounded-xl px-2.5 py-2 transition-colors"
            [class]="
              summary.id === activeId()
                ? 'bg-white shadow-sm ring-1 ring-slate-200'
                : 'hover:bg-white/70'
            "
          >
            <button
              type="button"
              (click)="onSelect(summary.id)"
              [attr.aria-current]="summary.id === activeId() ? 'true' : null"
              class="min-w-0 flex-1 text-left"
            >
              <span class="flex items-baseline justify-between gap-2">
                <span
                  class="truncate text-xs font-semibold"
                  [class]="summary.id === activeId() ? 'text-slate-800' : 'text-slate-600'"
                >
                  {{ summary.label }}
                </span>
                <span class="shrink-0 text-[10px] text-slate-400">
                  {{ summary.updatedAt | date: 'shortTime' }}
                </span>
              </span>
              <span class="mt-0.5 flex items-center gap-1.5">
                <span class="truncate text-[11px] text-slate-400">{{ summary.preview }}</span>
              </span>
            </button>

            <button
              type="button"
              (click)="onRemove($event, summary.id)"
              [attr.aria-label]="'Remove ' + summary.label + ' from this list'"
              title="Remove from this list"
              class="mt-0.5 shrink-0 rounded-md p-1 text-slate-300 opacity-0 transition-all group-hover:opacity-100 hover:bg-rose-100 hover:text-rose-600 focus-visible:opacity-100"
            >
              <svg class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path
                  d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"
                />
              </svg>
            </button>
          </div>
        </li>
      }
    </ul>
  }
</div>
